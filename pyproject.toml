[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pit"
version = "0.1.0"
description = "Traceable technology-intelligence research service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "fpdf2>=2.7",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "bcrypt>=4.0",
    "pyjwt>=2.9",
    "email-validator>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
]
agents = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.scripts]
pit = "pit.api:main"
pit-product-intelligence = "pit_agents.product_intelligence.runner:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["pit*", "pit_agents*"]


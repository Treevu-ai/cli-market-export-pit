[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pit"
version = "0.1.0"
description = "Traceable technology-intelligence research service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "fpdf2>=2.7,<3",
    "psycopg2-binary>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "bcrypt>=4.0,<6",
    "pyjwt>=2.9,<3",
    "email-validator>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<8",
    "httpx>=0.27,<1.0",
    "ruff>=0.9,<0.17",
]
agents = [
    "anthropic>=0.40,<1.0",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
pit = "pit.api:main"
pit-product-intelligence = "pit_agents.product_intelligence.runner:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["pit*", "pit_agents*"]

[tool.ruff.lint]
ignore = [
    # FastAPI's dependency-injection pattern requires calling Depends(...) in
    # argument defaults — this is the framework's documented idiom, not a bug.
    "B008",
]


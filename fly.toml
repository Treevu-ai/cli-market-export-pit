app = "cli-market-pit"
primary_region = "gru"

[build]

[env]
  PIT_DB_PATH = "/data/pit.db"
  PIT_RAW_DIR = "/data/raw"
  CLIMARKET_API_URL = "https://cli-market-api.fly.dev"

[[mounts]]
  source = "pit_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/v1/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

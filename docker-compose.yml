version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PITCHAVI_DB_PATH: /data/pitchavi.db
      PITCHAVI_RAW_DIR: /data/raw
      PITCHAVI_API_KEY: ${PITCHAVI_API_KEY:-}
      PITCHAVI_CONTACT_EMAIL: ${PITCHAVI_CONTACT_EMAIL:-}
      EPO_OPS_CONSUMER_KEY: ${EPO_OPS_CONSUMER_KEY:-}
      EPO_OPS_CONSUMER_SECRET: ${EPO_OPS_CONSUMER_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://pitchavi:pitchavi@db:5432/pitchavi}
    volumes:
      - pitchavi_data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pitchavi
      POSTGRES_PASSWORD: pitchavi
      POSTGRES_DB: pitchavi
    volumes:
      - pitchavi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitchavi"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pitchavi_data:
  pitchavi_pgdata:

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .[dev]
      - name: Run tests
        run: |
          python -m unittest discover -s tests -v
      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check src/ tests/
      - name: Type check with mypy
        run: |
          pip install mypy
          mypy src/ --ignore-missing-imports

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t pit:test .
      - name: Test Docker Compose
        run: docker compose config

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-next/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install backend dependencies
        # The E2E suite's login-flow spec boots a real FastAPI backend
        # (see web-next/playwright.config.ts's second webServer entry) —
        # not just the frontend — so `pit` must be importable here too.
        run: pip install .
      - name: Install dependencies
        working-directory: web-next
        run: npm ci
      - name: Build
        working-directory: web-next
        run: npm run build
      - name: Install Playwright browsers
        working-directory: web-next
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: web-next
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web-next/playwright-report/
          retention-days: 14
